<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Miss Niu Technology Pte Ltd is a strategic development and global growth architecture firm offering overseas development consultation, HR & workforce consultancy, AI solutions and digital transformation across Asia."
    />
    <title>Miss Niu Technology | Overseas Development, HR &amp; AI Consultancy</title>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #16181d;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #app-loader.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-loader .loader-mark {
        width: 72px;
        height: 72px;
        animation: loader-pulse 1.6s ease-in-out infinite;
      }
      #app-loader .loader-mark .n-path {
        fill: none;
        stroke: #ef5a5f;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: loader-draw 1.6s ease-in-out infinite;
      }
      #app-loader .loader-brand {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      #app-loader .loader-brand strong {
        display: block;
        color: #ef5a5f;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      #app-loader .loader-brand span {
        display: block;
        margin-top: 2px;
        color: #7c7f8a;
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.35em;
      }
      #app-loader .loader-bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: #26282e;
        overflow: hidden;
      }
      #app-loader .loader-bar::after {
        content: '';
        display: block;
        width: 0;
        height: 100%;
        border-radius: 999px;
        background: #ef5a5f;
        animation: loader-progress 1.4s forwards;
      }
      @keyframes loader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes loader-draw {
        0% { stroke-dashoffset: 120; }
        55%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes loader-progress {
        0% {
          width: 0;
          animation-timing-function: cubic-bezier(0.1, 0.7, 0.3, 1);
        }
        42% {
          width: 80%;
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        100% {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .loader-mark,
        #app-loader .loader-bar::after {
          animation: none;
        }
        #app-loader .loader-bar::after {
          width: 100%;
        }
        #app-loader .loader-mark .n-path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" role="status" aria-label="Loading Miss Niu Technology">
      <svg class="loader-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="12" fill="#26282e" />
        <path class="n-path" d="M21 45V19l22 26V19" />
      </svg>
      <div class="loader-brand">
        <strong>MISS NIU</strong>
        <span>TECHNOLOGY</span>
      </div>
      <div class="loader-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
